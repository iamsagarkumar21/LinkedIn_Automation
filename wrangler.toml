name = "linkedin-auto-poster"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["35 7 25 10 *", "30 5 * * *"]  # one-off today 13:05 IST + daily 11:00 IST

[[kv_namespaces]]
binding = "STATE"
id = "a99c944b82204e358d5bc1ecbcbbd211"

[vars]
AWS_REGION = "us-east-1"
BEDROCK_MODEL_ID = "us.anthropic.claude-3-5-haiku-20241022-v1:0"
LINKEDIN_VERSION = "202610"
DRY_RUN = "false"
